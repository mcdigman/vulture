name: Liveness Primer

# Measure this PR's Vulture changes without granting PR-controlled code a
# write token. The default-branch comment workflow consumes the artifact.
on:
  pull_request:
    # Corpus runs are intentionally not repeated for every pushed commit.
    # Use workflow_dispatch to re-measure a moved head.
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-measure
        required: true

concurrency:
  group: liveness-primer-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  # Exact liveness_primer main commit selected for this simulation.
  LIVENESS_PRIMER_REF: ca2ca73672af451a7faf271ac6786830f68d6834
  # Vulture 2.14 declares support through Python 3.13.
  PYTHON_VERSION: "3.13"
  # The historical Vulture revisions use setup.py without a build-system
  # table, so their otherwise implicit build tools are pinned explicitly.
  SETUPTOOLS_VERSION: "75.6.0"
  WHEEL_VERSION: "0.45.1"

permissions:
  contents: read

jobs:
  vulture:
    name: Vulture blast radius
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the pull request under measurement
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          number=$(printf '%s' "$PR_NUMBER" | tr -dc '0-9')
          test -n "$number"
          gh api "repos/${{ github.repository }}/pulls/$number" \
            --jq '"base=" + .base.sha, "head=" + .head.sha' >> "$GITHUB_OUTPUT"
          printf '%s\n' "$number" > pr-number.txt

      - name: Check out liveness_primer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mcdigman/liveness_primer
          ref: ${{ env.LIVENESS_PRIMER_REF }}
          path: _liveness_primer
          persist-credentials: false

      - name: Check out base Vulture
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ steps.pr.outputs.base }}
          path: _vulture_base
          persist-credentials: false

      - name: Check out head Vulture
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ steps.pr.outputs.head }}
          path: _vulture_head
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: _liveness_primer/pyproject.toml

      - name: Build the historical Vulture commands
        run: |
          set -euo pipefail
          uv venv --python "$PYTHON_VERSION" _vulture_base_env
          uv venv --python "$PYTHON_VERSION" _vulture_head_env
          uv pip install --python _vulture_base_env/bin/python \
            "setuptools==$SETUPTOOLS_VERSION" "wheel==$WHEEL_VERSION"
          uv pip install --python _vulture_head_env/bin/python \
            "setuptools==$SETUPTOOLS_VERSION" "wheel==$WHEEL_VERSION"
          uv pip install --python _vulture_base_env/bin/python \
            --no-deps --no-build-isolation ./_vulture_base
          uv pip install --python _vulture_head_env/bin/python \
            --no-deps --no-build-isolation ./_vulture_head
          _vulture_base_env/bin/vulture --version
          _vulture_head_env/bin/vulture --version

      - name: Compare Vulture revisions across the corpus
        run: |
          set -o pipefail
          uvx --from ./_liveness_primer \
            liveness-primer run \
            --tool vulture \
            --old-cmd "$GITHUB_WORKSPACE/_vulture_base_env/bin/vulture" \
            --new-cmd "$GITHUB_WORKSPACE/_vulture_head_env/bin/vulture" \
            --all \
            --output github \
            --json-out liveness-primer-report.json \
            --jobs 4 \
            --timeout 180 \
            | tee liveness-primer-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload liveness_primer report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: liveness-primer-report
          path: |
            liveness-primer-report.md
            liveness-primer-report.json
            pr-number.txt
          if-no-files-found: error
